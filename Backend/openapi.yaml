openapi: 3.1.0
info:
  title: Mino Backend API
  version: 0.1.0
  description: >-
    Mino MVP contract shared by the macOS clients and service. Every idempotencyKey is bound to
    the canonical request payload: an exact retry replays the first result, while reusing the key
    with different input returns 409 idempotency_key_reused.
servers:
  - url: http://127.0.0.1:8080/v1
    description: Local MVP server
  - url: https://api.example.com/mino/v1
    description: Placeholder only; configure the real endpoint at build or launch time.
paths:
  /health:
    get:
      operationId: checkHealth
      summary: Check API compatibility and availability
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /dev/bootstrap:
    post:
      operationId: bootstrapDevelopmentProfile
      summary: Create or fetch a local development profile
      description: >-
        Available only when DEV_BOOTSTRAP_ENABLED=true and never in production. Alice, Bob, and Charlie use
        deterministic, public local-development tokens so a client session survives service restarts;
        these credentials are explicitly rejected by the production Postgres store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevBootstrapRequest"
      responses:
        "200":
          description: Development identity and bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevProfileEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /me:
    get:
      operationId: getCurrentAccount
      summary: Get the authenticated account and its own pet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthContextEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /friendships:
    get:
      operationId: listFriendships
      summary: List the authenticated account's friendship requests and friends
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FriendshipStatus"
      responses:
        "200":
          description: Friendships visible to the authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipListEnvelope"
        default:
          $ref: "#/components/responses/APIError"
    post:
      operationId: requestFriendship
      summary: Send a friendship request to another account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestFriendshipCommand"
      responses:
        "200":
          description: Pending friendship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipEnvelope"
        "409":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /friendships/{friendshipID}/respond:
    post:
      operationId: respondToFriendship
      summary: Accept or reject a friendship request addressed to the account
      security:
        - bearerAuth: []
      parameters:
        - name: friendshipID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondFriendshipCommand"
      responses:
        "200":
          description: Resolved friendship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipEnvelope"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /events:
    get:
      operationId: fetchEvents
      summary: Catch up on durable friendship events after an event cursor
      description: >-
        This stream belongs to exactly one accepted friendship. To build a personal account view,
        list accepted friendships, retain one cursor per friendship, and merge events by occurredAt
        with sequence as a stable tie-breaker. Friendship requests are listed through /friendships.
      security:
        - bearerAuth: []
      parameters:
        - name: friendshipID
          in: query
          required: true
          description: Accepted friendship that owns the event stream.
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: >-
            A UUID event ID returned by a previous response. The cursor event is not repeated. An
            empty page preserves this cursor as nextCursor. A malformed UUID returns 400; an unknown
            or other-friendship event ID returns 404.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Durable events in server sequence order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipEventPageEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /timeline:
    get:
      operationId: fetchTimeline
      summary: Fetch only relationship events intended for the visible timeline
      description: >-
        Timeline pages are friendship-scoped. A client displaying an account-wide timeline must
        fetch each accepted friendship independently and merge the pages locally; no event from an
        unrelated or pending friendship is exposed through this cursor.
      security:
        - bearerAuth: []
      parameters:
        - name: friendshipID
          in: query
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: Same UUID and empty-page semantics as GET /events.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Timeline-visible events; events never include visit duration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipEventPageEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /ws:
    get:
      operationId: connectEventWebSocket
      summary: Upgrade to the in-process real-time event stream
      description: >-
        Authenticate with Authorization: Bearer. The server first sends WebSocketReady,
        then WebSocketFriendshipEvent messages. Clients must still use GET /events for durable catch-up.
      security:
        - bearerAuth: []
      parameters:
        - name: friendshipID
          in: query
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: >-
            Last durably handled event UUID. The server replays later events while buffering
            concurrent publications, closing the REST catch-up to WebSocket subscription gap.
          schema:
            type: string
            format: uuid
      responses:
        "101":
          description: WebSocket upgrade accepted
        default:
          $ref: "#/components/responses/APIError"
  /agent/decision:
    post:
      operationId: requestPetDecision
      summary: Run one stateless, structured model decision for the caller's pet
      description: >-
        The caller supplies an already-minimized context. Prompts, raw provider responses, and pet
        memories are not persisted. The validated decision, memory disposition, and usage are stored
        by inferenceID so retries and service restarts replay the original result without another
        model charge. A live claim returns 409; a stale started claim is treated as outcome-unknown
        and is never sent upstream again under the same ID. Sealed human
        letter bodies must never be supplied to this endpoint; state uses a strict allowlist and
        letter-shaped fields, memories, or non-generic sealed-letter summaries are rejected before
        the provider can be called. Every social-action recipient must be selected from the accepted
        pet IDs supplied in state.friendPetIDs.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetDecisionRequest"
      responses:
        "200":
          description: One policy-bounded decision and local memory disposition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetDecisionResponseEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /conversations:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: listConversations
      summary: Restore the current friendship's active pet conversation
      description: >-
        Returns at most one active conversation because the database enforces one active
        conversation per friendship. Both participating clients receive the same record after restart.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            const: active
            default: active
      responses:
        "200":
          description: Friendship-scoped active conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListEnvelope"
        default:
          $ref: "#/components/responses/APIError"
    post:
      operationId: createConversation
      summary: Start a pet conversation with the first public utterance
      description: >-
        A friendship may have only one active conversation. Concurrent attempts with different
        idempotency keys produce one success and stable 409 active_conversation_exists responses.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationCommand"
      responses:
        "200":
          description: Conversation and opening message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMutationEnvelope"
        "409":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /conversations/{conversationID}/messages:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: listConversationMessages
      summary: Restore the ordered transcript for one friendship-scoped conversation
      security:
        - bearerAuth: []
      parameters:
        - name: conversationID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages in creation order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMessageListEnvelope"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    post:
      operationId: sendConversationMessage
      summary: Add the current pet turn or an explicitly identified human interjection
      description: >-
        Pet turns alternate and are capped at six. Accepting turnIndex 5 marks the conversation
        ended and emits only conversation_message; the server does not synthesize a summary.
      security:
        - bearerAuth: []
      parameters:
        - name: conversationID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendConversationMessageCommand"
      responses:
        "200":
          description: Updated conversation and accepted message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMutationEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /conversations/{conversationID}/end:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    post:
      operationId: endConversation
      summary: Let the initiating pet submit the conversation's one timeline summary
      description: >-
        Only the authenticated owner of initiatorPetID may call this route. It remains valid after
        the sixth turn has already marked the conversation ended, allowing the initiator's local
        Agent to submit the first summary. Later calls never create a second summary.
      security:
        - bearerAuth: []
      parameters:
        - name: conversationID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndConversationCommand"
      responses:
        "200":
          description: Ended conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /visit-invitations:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: listMVPVisitInvitations
      summary: List friendship-scoped visit records, pending by default
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MVPVisitStatus"
      responses:
        "200":
          description: Matching visit records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MVPVisitListEnvelope"
        default:
          $ref: "#/components/responses/APIError"
    post:
      operationId: createMVPVisitInvitation
      summary: Ask for one pet to visit the other account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVisitInvitationCommand"
      responses:
        "200":
          description: Pending visit invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MVPVisitEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /visit-invitations/{visitID}/respond:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    post:
      operationId: respondToMVPVisitInvitation
      summary: Let the account opposite the invitation requester accept or decline
      description: >-
        Only the other party may respond. If requestedByAccountID is the visitor owner, the host
        responds; if the host requested the visit, the visitor owner responds.
      security:
        - bearerAuth: []
      parameters:
        - name: visitID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToMVPVisitCommand"
      responses:
        "200":
          description: Active or cancelled visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MVPVisitEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /visits/{visitID}/interactions:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    post:
      operationId: sendVisitInteraction
      summary: Let the host feed, play with, or message the visiting pet
      security:
        - bearerAuth: []
      parameters:
        - name: visitID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitInteractionCommand"
      responses:
        "200":
          description: Accepted interaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitInteractionEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /visits/{visitID}/reactions:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    post:
      operationId: sendVisitReaction
      summary: Relay the visiting pet Agent's reaction back to the host desktop
      description: >-
        Only the visitor pet's owner may call this route. The server validates and relays the
        reaction but never decides it. visit_reaction events are not timeline-visible.
      security:
        - bearerAuth: []
      parameters:
        - name: visitID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitReactionCommand"
      responses:
        "200":
          description: Accepted visitor reaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitReactionEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /visits/{visitID}/letter:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    post:
      operationId: attachVisitLetter
      summary: Attach a private plain-text human letter to an active visiting pet
      description: >-
        The API accepts plain text over HTTPS, while PostgreSQL stores AES-256-GCM ciphertext in both
        the letter record and any idempotency receipt. The body is never copied into FriendshipEvent
        payloads, Agent requests, model prompts, or timeline summaries.
      security:
        - bearerAuth: []
      parameters:
        - name: visitID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVisitLetterCommand"
      responses:
        "200":
          description: Letter carried until the visit ends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /letters/{letterID}:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: fetchLetter
      summary: Read a private letter when the authenticated account is allowed
      description: >-
        The author can read their own letter. The recipient receives a uniform 404 until the
        visit has ended and the letter status is delivered. Accounts outside the letter's friendship
        or outside its author/recipient pair also receive 404.
      security:
        - bearerAuth: []
      parameters:
        - name: letterID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorized private letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /visits/{visitID}/end:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    post:
      operationId: endMVPVisit
      summary: Return the pet home and atomically deliver carried letters
      security:
        - bearerAuth: []
      parameters:
        - name: visitID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdempotentCommand"
      responses:
        "200":
          description: Ended visit and delivered letter records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndVisitEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /interactions:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    post:
      operationId: sendInteraction
      summary: Deliver an idempotent interaction to the paired pet
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Mino-Client
          in: header
          required: true
          schema:
            type: string
            const: macos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionCommand"
      responses:
        "200":
          description: Accepted interaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionReceiptEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /pet-presence:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: fetchPetPresence
      summary: Fetch the server-authoritative location of both pets and active visits
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current pet presence snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetPresenceSnapshotEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /pet-visits:
    post:
      operationId: startPetVisit
      deprecated: true
      summary: Deprecated direct visit endpoint; use the invitation handshake
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPetVisitCommand"
      responses:
        "409":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /pet-visits/{visitID}/return:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    post:
      operationId: returnPetVisit
      summary: Start the pet's return trip and attach return cargo
      security:
        - bearerAuth: []
      parameters:
        - name: visitID
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnPetVisitCommand"
      responses:
        "200":
          description: Return accepted with authoritative presence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetVisitReceiptEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /pet-visit-invitations:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: fetchPetVisitInvitations
      summary: Fetch invitations addressed to the signed-in friend
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, accepted, declined, cancelled, expired]
      responses:
        "200":
          description: Matching invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetVisitInvitationListEnvelope"
        default:
          $ref: "#/components/responses/APIError"
    post:
      operationId: sendPetVisitInvitation
      summary: Invite the selected friend to send their pet for a visit
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendPetVisitInvitationCommand"
      responses:
        "200":
          description: Invitation accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetVisitInvitationEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /pet-visit-invitations/{invitationID}/response:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    post:
      operationId: respondToPetVisitInvitation
      summary: Accept or decline a visit invitation
      security:
        - bearerAuth: []
      parameters:
        - name: invitationID
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToPetVisitInvitationCommand"
      responses:
        "200":
          description: Response accepted; an accepted invitation may start a visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetVisitInvitationReceiptEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /friendship-events:
    parameters:
      - name: friendshipID
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: fetchFriendshipTimeline
      summary: Incrementally fetch durable friendship and visit events
      security:
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          description: A UUID event ID; malformed values return 400 and unknown or cross-friendship IDs return 404.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Events after the supplied cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipTimelinePageEnvelope"
        default:
          $ref: "#/components/responses/APIError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    APIError:
      description: Stable machine-readable error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    BackendHealth:
      type: object
      additionalProperties: false
      required: [status, apiVersion]
      properties:
        status:
          type: string

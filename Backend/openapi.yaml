          format: uuid
        visitID:
          type: string
        kind:
          type: string
          enum: [feed, play, message]
        acceptedAt:
          type: string
          format: date-time
    VisitInteractionEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/VisitInteractionReceipt"
    VisitReactionCommand:
      type: object
      additionalProperties: false
      required: [reaction, idempotencyKey]
      properties:
        reaction:
          type: string
          minLength: 1
          maxLength: 80
        text:
          type: string
          minLength: 1
          maxLength: 500
        idempotencyKey:
          type: string
          format: uuid
    VisitReactionReceipt:
      type: object
      additionalProperties: false
      required: [reactionID, visitID, reaction, acceptedAt]
      properties:
        reactionID:
          type: string
          format: uuid
        visitID:
          type: string
        reaction:
          type: string
          maxLength: 80
        acceptedAt:
          type: string
          format: date-time
    VisitReactionEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/VisitReactionReceipt"
    Letter:
      type: object
      additionalProperties: false
      required:
        - id
        - friendshipID
        - visitID
        - authorAccountID
        - recipientAccountID
        - body
        - status
        - createdAt
        - deliveredAt
      properties:
        id:
          type: string
        friendshipID:
          type: string
        visitID:
          type: string
        authorAccountID:
          type: string
        recipientAccountID:
          type: string
        body:
          type: string
          maxLength: 2000
          description: >-
            Private human-authored content. Encrypted with server-side AES-256-GCM at rest and never
            copied into events or model input. This API representation is decrypted only for an
            authorized author or a recipient after delivery.
        status:
          type: string
          enum: [carried, delivered]
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: [string, "null"]
          format: date-time
    CreateVisitLetterCommand:
      type: object
      additionalProperties: false
      required: [body, idempotencyKey]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        idempotencyKey:
          type: string
          format: uuid
          description: Exact retries replay; its persisted receipt contains ciphertext, not the body.
    LetterEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Letter"
    IdempotentCommand:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey:
          type: string
          format: uuid
    EndVisitReceipt:
      type: object
      additionalProperties: false
      required: [visit, deliveredLetters]
      properties:
        visit:
          $ref: "#/components/schemas/MVPVisit"
        deliveredLetters:
          type: array
          items:
            $ref: "#/components/schemas/Letter"
    EndVisitEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/EndVisitReceipt"
    APIErrorBody:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIErrorBody"

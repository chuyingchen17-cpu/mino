          type: string
          minLength: 1
        phase:
          type: string
          enum: [at_home, outbound, visiting, returning]
        currentHostAccountID:
          type: [string, "null"]
          description: >-
            The current friendship's host. Null while the pet is visiting through a different
            friendship, so that relationship remains private.
        activeVisitID:
          type: [string, "null"]
          description: >-
            The current friendship's active visit ID. Null while the pet is globally away through
            a different friendship.

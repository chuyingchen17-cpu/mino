    MVPVisitStatus:
      type: string
      enum: [pending, active, ended, cancelled]
    MVPVisit:
      type: object
      additionalProperties: false
      required:
        - id
        - friendshipID
        - visitorPetID
        - visitorOwnerAccountID
        - hostAccountID
        - requestedByAccountID
        - reason
        - status
        - createdAt
        - startedAt
        - endedAt
      properties:
        id:
          type: string
        friendshipID:
          type: string
        visitorPetID:
          type: string
        visitorOwnerAccountID:
          type: string
        hostAccountID:
          type: string
        requestedByAccountID:
          type: string
          description: >-
            Invitation initiator. The responder is always the other party: hostAccountID when this
            equals visitorOwnerAccountID, otherwise visitorOwnerAccountID.
        reason:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/MVPVisitStatus"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        endedAt:
          type: [string, "null"]
          format: date-time
    MVPVisitEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MVPVisit"
    MVPVisitListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MVPVisit"
    CreateVisitInvitationCommand:
      type: object
      additionalProperties: false

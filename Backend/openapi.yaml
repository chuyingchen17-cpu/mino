        idempotencyKey:
          type: string
          format: uuid
          description: Exact retries replay; reuse with a different request payload returns 409.
    VisitInteractionCommand:
      type: object
      additionalProperties: false
      required: [kind, idempotencyKey]
      properties:
        kind:
          type: string
          enum: [feed, play, message]
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Required when kind is message.
        idempotencyKey:
          type: string
          format: uuid
    VisitInteractionReceipt:
      type: object
      additionalProperties: false
      required: [interactionID, visitID, kind, acceptedAt]
      properties:
        interactionID:

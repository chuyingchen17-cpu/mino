        data:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
    ConversationEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Conversation"
    CreateConversationCommand:
      type: object
      additionalProperties: false

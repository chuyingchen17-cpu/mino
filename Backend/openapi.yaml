    FriendshipEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - sequence
        - friendshipID
        - type
        - actorType
        - actorID
        - payload
        - timelineVisible
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        friendshipID:
          type: string
        type:
          type: string
          enum:
            - conversation_message
            - conversation_summary
            - visit_invited
            - visit_arrived
            - visit_declined
            - visit_interaction
            - visit_reaction
            - letter_attached
            - visit_returned
            - letter_received
            - interaction
        actorType:
          type: string
          enum: [human, pet, system]
        actorID:
          type: [string, "null"]
        payload:
          type: object
          additionalProperties: true
          description: >-
            Event-specific public routing data. conversation_message uses conversationID, messageID,
            recipientPetID, text, turnIndex. conversation_summary uses conversationID, summary.
            visit_invited uses visitID, visitorPetID, hostAccountID, requestedByAccountID,
            responderAccountID, reason. visit_arrived and visit_declined use visitID, visitorPetID,
            hostAccountID, requestedByAccountID, responderAccountID. visit_interaction uses
            interactionID, visitID, visitorPetID, kind and optional text. visit_reaction uses
            visitID, visitorPetID, reaction and optional text. letter_attached uses
            letterID, visitID, recipientAccountID. visit_returned uses visitID, visitorPetID.
            letter_received uses letterID, visitID, authorAccountID, recipientAccountID.
            Letter bodies are categorically forbidden from event payloads.
        timelineVisible:
          type: boolean
        occurredAt:
          type: string
          format: date-time

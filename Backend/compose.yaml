services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mino
      POSTGRES_USER: mino
      POSTGRES_PASSWORD: mino_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mino -d mino"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mino-postgres-data:/var/lib/postgresql/data

volumes:
  mino-postgres-data:

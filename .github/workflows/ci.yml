name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: Backend
      - name: Typecheck and test in Workers Runtime
        run: |
          npm run typecheck
          npm test
        working-directory: Backend
      - name: Verify generated OpenAPI contract
        run: |
          npm run openapi
          git diff --exit-code -- openapi.yaml
        working-directory: Backend
      - name: Validate Wrangler bundle and bindings
        run: npm run deploy:dry-run
        working-directory: Backend

  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: Scripts/test.sh
      - name: Build release app bundle
        # CI validates the bundle shape only; this artifact is never distributed.
        # Production and QA release builds must use a stable Developer ID identity.
        run: MINO_BUILD_CONFIGURATION=release MINO_ALLOW_ADHOC_RELEASE=1 Scripts/build-app.sh
      - name: Validate bundle metadata
        run: |
          plutil -lint .build/Mino.app/Contents/Info.plist
          codesign --verify --deep --strict .build/Mino.app

  /v1/auth/github/device/complete:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceCode:
                  type: string
                  minLength: 20
                  maxLength: 256
                device:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    displayName:
                      type: string
                      minLength: 1
                      maxLength: 80
                    platform:
                      type: string
                      enum:
                        - macos
                    appVersion:
                      type: string
                      minLength: 1
                      maxLength: 40
                  required:
                    - displayName
                    - platform
                    - appVersion
                  additionalProperties: false
              required:
                - deviceCode
                - device
              additionalProperties: false
      responses:
        "200":
          description: Pending status or authenticated Mino session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - pending
                          retryAfterSeconds:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                        required:
                          - status
                          - retryAfterSeconds
                      - type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - authenticated
                          session:
                            type: object
                            properties:
                              accessToken:
                                type: string
                              refreshToken:
                                type: string
                              accessExpiresAt:
                                type: number
                              refreshExpiresAt:
                                type: number
                              accountID:
                                type: string
                              device:
                                nullable: true
                              pet:
                                nullable: true
                              isPrimaryAgentDevice:
                                type: boolean
                            required:
                              - accessToken
                              - refreshToken
                              - accessExpiresAt
                              - refreshExpiresAt
                              - accountID
                              - isPrimaryAgentDevice
                        required:
                          - status
                          - session
                required:
                  - data
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object

      responses:
        "200":
          description: Worker health
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - healthy
                      apiVersion:
                        type: string
                      storage:
                        type: string
                        enum:
                          - d1
                      realtime:
                        type: string
                        enum:
                          - account-durable-object
                    required:
                      - status
                      - apiVersion
                      - storage
                      - realtime
                required:
                  - data
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        "403":
          description: Forbidden
